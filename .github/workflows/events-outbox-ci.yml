name: Events outbox isolated tests
on:
  pull_request:
    paths:
      - 'ola_events/**'
      - 'tests/test_ola_events_outbox.py'
      - 'tests/conftest.py'
      - 'requirements.txt'
      - '.github/workflows/events-outbox-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install complete project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated outbox regression tests
        run: python -m pytest tests/test_ola_events_outbox.py -q
