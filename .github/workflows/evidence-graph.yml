name: Evidence Graph v0.1

on:
  push:
    branches: ["main", "feat/evidence-graph-v0.1"]
  pull_request:

jobs:
  evidence-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q evidence_graph.py tests
      - name: Contract tests
        run: pytest -q -ra
