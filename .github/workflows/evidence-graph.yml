name: Evidence Graph v0.1

on:
  push:
    branches: ["main", "feat/evidence-graph-v0.1"]
  pull_request:

jobs:
  evidence-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install repo dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Evidence Graph package
        run: python -m pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q evidence_graph.py tests
      - name: Contract tests
        run: pytest -q -ra

  evidence-graph-ubuntu26-compat:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install repo dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Evidence Graph package
        run: python -m pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q evidence_graph.py tests
      - name: Contract tests
        run: pytest -q -ra
