name: OLA 12h Autonomous Evidence Flow

on:
  schedule:
    - cron: '17 0,12 * * *'
      timezone: "Europe/Brussels"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ola-12h-autoflow.yml
      - .github/workflows/nina-igor-ollama.yml
      - app/agent_runtime.py
      - app/igor.py
      - app/replay.py
      - app/main.py

concurrency:
  group: ola-12h-autoflow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact scheduled source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record source provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "SOURCE_BRANCH=$GITHUB_REF_NAME"
            echo "TRIGGER=$GITHUB_EVENT_NAME"
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee source-provenance.txt

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: NINA contract gate
        run: |
          set -o pipefail
          pytest -q tests/test_nina.py tests/test_nina_run_endpoint_contract.py tests/test_nina_igor_chain.py tests/test_review_gate.py 2>&1 | tee nina-gate.log

      - name: IGOR tamper + replay gate
        run: |
          set -o pipefail
          pytest -q tests/test_igor.py tests/test_independent_verifier_tamper.py tests/test_contradiction_replay.py tests/test_replay.py 2>&1 | tee igor-replay-gate.log

  real_ollama_flow:
    needs: preflight
    uses: ./.github/workflows/nina-igor-ollama.yml

  classify:
    needs: [preflight, real_ollama_flow]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source for classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Classify AUTO evidence
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          OLLAMA_RESULT: ${{ needs.real_ollama_flow.result }}
        run: |
          set -euo pipefail
          status="BLOCKED"
          reason="unknown"
          if [ "$PREFLIGHT_RESULT" != "success" ]; then
            reason="preflight_failed"
          elif [ "$OLLAMA_RESULT" != "success" ]; then
            reason="real_ollama_full_flow_failed"
          else
            status="RUNTIME_CHAIN_VERIFIED"
            reason="NINA_TO_IGOR_PROVENANCE_REPLAY_PASSED"
          fi
          cat > ola-auto-evidence.json <<EOF
          {
            "schema": "ola-auto-evidence-v2",
            "source_commit": "$GITHUB_SHA",
            "github_run_id": $GITHUB_RUN_ID,
            "correlation_key": "$GITHUB_SHA",
            "trigger": "$GITHUB_EVENT_NAME",
            "provider": "ollama",
            "model": "qwen2.5:0.5b-instruct",
            "preflight": "$PREFLIGHT_RESULT",
            "real_ollama_full_flow": "$OLLAMA_RESULT",
            "status": "$status",
            "reason": "$reason",
            "openai_required": false,
            "verified_claim": $([ "$status" = "RUNTIME_CHAIN_VERIFIED" ] && echo true || echo false),
            "human_gate": "required_for_terminal_execution",
            "fail_closed": true
          }
          EOF
          sha256sum ola-auto-evidence.json | tee ola-auto-evidence.sha256

      - name: Upload AUTO evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-auto-evidence-${{ github.sha }}
          path: |
            source-provenance.txt
            nina-gate.log
            igor-replay-gate.log
            ola-auto-evidence.json
            ola-auto-evidence.sha256
          if-no-files-found: warn

      - name: Fail closed
        if: always()
        run: |
          set -euo pipefail
          status="$(python -c 'import json; print(json.load(open("ola-auto-evidence.json"))["status"])')"
          test "$status" = "RUNTIME_CHAIN_VERIFIED"
