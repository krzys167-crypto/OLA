name: Pipeline Bridge Gate (NINA-OLLAMA-EVIDENCE-IGOR-GATE-REPLAY)

# STATUS: first run (id 37224802601) was green at job/step level. The test-level counts of that run
# could not be read (job logs and artifacts were not reachable from the authoring sandbox), and a
# pytest run in which everything is skipped also exits 0, so that run alone does not prove the live
# tests executed. This version fails the live job if anything was skipped and publishes the pytest
# summary and the LIVE RESULT line as annotations.
# The live job needs a runner that can install Ollama and pull a model.

on:
  pull_request:
  push:
    branches:
      - feat/pipeline-bridge

permissions:
  contents: read

env:
  # Reasoning on for the judge: a non-reasoning 0.6B judge failed the calibration canary in local runs
  # (-> REVIEW_REQUIRED -> BLOCK), which is the gate working as designed.
  OLA_TEST_MODEL: qwen3:0.6b
  OLA_TEST_THINK: "1"

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Full suite (live tests are skipped = UNKNOWN here)
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider -o addopts="" -q -rs | tee offline-result.txt
          echo "::notice title=offline suite::$(tail -n 1 offline-result.txt)"
      - name: Standalone verifier needs nothing but the stdlib
        run: |
          mkdir /tmp/lone && cp ola_pipeline/verify.py /tmp/lone/
          python /tmp/lone/verify.py --help >/dev/null

  live:
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Set up Ollama and pull the model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null && break
            sleep 2
          done
          ollama pull "$OLA_TEST_MODEL"
          curl --fail --silent http://127.0.0.1:11434/api/tags > ollama-models.json
      - name: Live pipeline tests (real Ollama)
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider -o addopts="" -q -s -rs \
            tests/pipeline_suite/test_real_ollama.py tests/test_pipeline_bridge_live.py | tee live-result.txt
          # pytest exits 0 when every test is skipped. A green live job must never mean "nothing ran".
          if grep -Eq '[0-9]+ skipped' live-result.txt || ! grep -Eq '[0-9]+ passed' live-result.txt; then
            echo "::error title=live tests did not run::real-runtime result is UNKNOWN"
            exit 1
          fi
          # Annotations are readable through the API even when job logs and artifacts are not.
          grep -E 'LIVE RESULT:' live-result.txt | while IFS= read -r line; do
            echo "::notice title=live result::${line}"
          done
          echo "::notice title=live suite::$(tail -n 1 live-result.txt)"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-bridge-live-evidence
          path: |
            live-result.txt
            ollama-models.json

  # The judge is a different model from the generator (no same-model opt-in). Whatever the Gate decides
  # is published as-is: PASS, REVIEW_REQUIRED and BLOCK are all legitimate outcomes. The job fails only
  # when the test did not run. llama3.2 is a different model family; qwen3:1.7b is only a different
  # model of the SAME family, so its errors may be correlated with the generator's.
  live-independent-judge:
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - judge: "llama3.2:3b"
            judge_think: ""
          - judge: "qwen3:1.7b"
            judge_think: "1"
    env:
      OLA_TEST_IGOR_MODEL: ${{ matrix.judge }}
      OLA_TEST_IGOR_THINK: ${{ matrix.judge_think }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Set up Ollama and pull generator and judge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null && break
            sleep 2
          done
          ollama pull "$OLA_TEST_MODEL"
          ollama pull "$OLA_TEST_IGOR_MODEL"
          curl --fail --silent http://127.0.0.1:11434/api/tags > ollama-models.json
      - name: Live bridge test with an independent judge
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider -o addopts="" -q -s -rs tests/test_pipeline_bridge_live.py | tee live-result.txt
          if grep -Eq '[0-9]+ skipped' live-result.txt || ! grep -Eq '[0-9]+ passed' live-result.txt; then
            echo "::error title=live tests did not run::real-runtime result is UNKNOWN"
            exit 1
          fi
          grep -E 'LIVE RESULT:' live-result.txt | while IFS= read -r line; do
            echo "::notice title=independent judge result::${line}"
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-bridge-independent-judge-${{ strategy.job-index }}
          path: |
            live-result.txt
            ollama-models.json

  # Ambient NINA/IGOR (OLA_AMBIENT_IGOR=shadow|enforce) with a REAL Ollama judge. The answering model is a stub.
  # Whatever the judge decides is published as-is; the job fails only when the tests did not run. The
  # qualification file used for `enforce` is a test fixture (plumbing), not a measurement of the judge.
  live-ambient:
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - judge: "llama3.2:3b"
            judge_think: ""
          - judge: "qwen3:1.7b"
            judge_think: "1"
    env:
      OLA_TEST_IGOR_MODEL: ${{ matrix.judge }}
      OLA_TEST_IGOR_THINK: ${{ matrix.judge_think }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Set up Ollama and pull the judge
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null && break
            sleep 2
          done
          ollama pull "$OLA_TEST_IGOR_MODEL"
      - name: Live ambient NINA/IGOR tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider -o addopts="" -q -s -rs tests/test_ambient_live.py | tee live-result.txt
          if grep -Eq '[0-9]+ skipped' live-result.txt || ! grep -Eq '[0-9]+ passed' live-result.txt; then
            echo "::error title=live ambient tests did not run::real-runtime result is UNKNOWN"
            exit 1
          fi
          grep -E 'LIVE RESULT:' live-result.txt | while IFS= read -r line; do
            echo "::notice title=ambient live result::${line}"
          done

  # How often does each judge PASS a WRONG answer? 47 labelled items (tests/data/judge_eval.json), same judge
  # prompt and acceptance rule as Igor. Published as annotations; the job fails only when no verdict was obtained
  # at all (nothing ran = UNKNOWN). Small n: the script prints Wilson 95% intervals, this is not a certification.
  judge-accuracy:
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - judge: "qwen3:0.6b"
            think: "1"
          - judge: "qwen3:1.7b"
            think: "1"
          - judge: "llama3.2:3b"
            think: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Set up Ollama and pull the judge
        shell: bash
        env:
          JUDGE: ${{ matrix.judge }}
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null && break
            sleep 2
          done
          ollama pull "$JUDGE"
      - name: Judge against labelled answers
        shell: bash
        env:
          JUDGE: ${{ matrix.judge }}
          JUDGE_THINK: ${{ matrix.think }}
        run: |
          set -euo pipefail
          args=(--model "$JUDGE" --out judge-eval.json)
          if [ -n "$JUDGE_THINK" ]; then args+=(--think "$JUDGE_THINK"); fi
          python scripts/judge_eval.py "${args[@]}" | tee judge-eval.txt
          # Annotations are readable through the API even when job logs and artifacts are not.
          # Few, aggregated lines: GitHub caps annotations per step.
          grep -E '^JUDGE EVAL:' judge-eval.txt | while IFS= read -r line; do
            echo "::notice title=judge accuracy::${line}"
          done
          python - <<'PY'
          import json
          d = json.load(open("judge-eval.json"))
          bad = [f"{r['id']}" for r in d["runs"] if r["label"] == "wrong" and r["verdict"] == "ACCEPT"]
          print(f"::notice title=judge false accepts::{d['model']} accepted {len(bad)} wrong answer(s): {', '.join(bad) or 'none'}")
          cats = "; ".join(f"{c} {v['false_accept']}/{v['wrong_n']}" for c, v in sorted(d["summary"]["by_category"].items()) if v["wrong_n"])
          print(f"::notice title=judge false accepts by category::{d['model']}: {cats}")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-accuracy-${{ strategy.job-index }}
          path: |
            judge-eval.json
            judge-eval.txt

  # Larger judges (7-9B, CPU) on the v2 set (72 wrong answers). With the 26 wrong answers of v1 a 15% bound is only
  # reachable at 0 false accepts; v2 allows up to 4 (Wilson 95% upper bound 13.4%). Published as annotations; the job
  # fails only when no verdict was obtained at all. NOT a certification: one run, one dataset, arithmetic/strings/facts.
  judge-accuracy-v2:
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - judge: "llama3.2:3b"
          - judge: "llama3.1:8b"
          - judge: "qwen2.5:7b"
          - judge: "gemma2:9b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Set up Ollama and pull the judge
        shell: bash
        env:
          JUDGE: ${{ matrix.judge }}
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null && break
            sleep 2
          done
          ollama pull "$JUDGE"
          df -h / | tail -1
      - name: Judge against the v2 labelled answers
        shell: bash
        env:
          JUDGE: ${{ matrix.judge }}
        run: |
          set -euo pipefail
          echo "::notice title=dataset::judge_eval_v2.json sha256=$(sha256sum tests/data/judge_eval_v2.json | cut -d' ' -f1)"
          python scripts/judge_eval.py --model "$JUDGE" --dataset tests/data/judge_eval_v2.json --out judge-eval-v2.json | tee judge-eval-v2.txt
          grep -E '^JUDGE EVAL:' judge-eval-v2.txt | while IFS= read -r line; do
            echo "::notice title=judge accuracy v2::${line}"
          done
          python - <<'PY'
          import json, math
          d = json.load(open("judge-eval-v2.json"))
          fa = d["summary"]["false_accept"]; k, n = fa["k"], fa["n"]
          z = 1.96; p = k / n; dd = 1 + z * z / n
          up = min(1.0, (p + z * z / (2 * n) + z * math.sqrt(p * (1 - p) / n + z * z / (4 * n * n))) / dd)
          ca = d["summary"]["correct_accepted"]; ck, cn = ca["k"], ca["n"]
          p2 = ck / cn; d2 = 1 + z * z / cn
          lo = max(0.0, (p2 + z * z / (2 * cn) - z * math.sqrt(p2 * (1 - p2) / cn + z * z / (4 * cn * cn))) / d2)
          ok = up <= 0.15 and lo >= 0.5 and n >= 20 and cn >= 20 and d["summary"]["verdicts_obtained"] > 0
          print(f"::notice title=judge v2 summary::{d['model']} false_accept {k}/{n} upper95={up:.3f} (<=0.150 needed); "
                f"correct_accepted {ck}/{cn} lower95={lo:.3f} (>=0.500 needed); verdicts_obtained {d['summary']['verdicts_obtained']}; "
                f"WOULD_QUALIFY={'yes' if ok else 'NO'}; model_digest={d['meta'].get('model_digest')}")
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-accuracy-v2-${{ strategy.job-index }}
          path: |
            judge-eval-v2.json
            judge-eval-v2.txt
