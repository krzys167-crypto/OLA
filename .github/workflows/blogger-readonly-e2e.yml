name: Blogger Read-only End-to-End

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-readonly-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blogger-readonly-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OLA_LLM_MODE: deterministic
      GOOGLE_BLOGGER_API_KEY: ${{ secrets.GOOGLE_BLOGGER_API_KEY }}
      BLOGGER_E2E_BLOG_ID: ${{ secrets.BLOGGER_E2E_BLOG_ID }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application and tests
        run: python -m compileall -q app tests

      - name: Run Blogger adapter, security, evidence and HTTP E2E tests
        run: python -m pytest -q tests/test_blogger_readonly.py tests/test_blogger_http_e2e.py

      - name: Report live Blogger smoke-test configuration
        if: always()
        env:
          GOOGLE_BLOGGER_API_KEY: ${{ secrets.GOOGLE_BLOGGER_API_KEY }}
          BLOGGER_E2E_BLOG_ID: ${{ secrets.BLOGGER_E2E_BLOG_ID }}
        run: |
          if [ -n "$GOOGLE_BLOGGER_API_KEY" ] && [ -n "$BLOGGER_E2E_BLOG_ID" ]; then
            echo "LIVE_BLOGGER_E2E=CONFIGURED"
          else
            echo "LIVE_BLOGGER_E2E=SKIPPED — configure GOOGLE_BLOGGER_API_KEY and BLOGGER_E2E_BLOG_ID repository secrets"
          fi
