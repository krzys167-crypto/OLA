name: NINA Parallel DAG Gate

on:
  pull_request:
    paths:
      - 'app/workflow_engine.py'
      - 'app/nina_workflow.py'
      - 'app/nina.py'
      - 'app/main.py'
      - 'tests/test_workflow_engine.py'
      - 'tests/test_nina_workflow.py'
      - 'tests/test_nina_workflow_api.py'
      - '.github/workflows/nina-parallel-dag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dag-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked requirements
        run: python -m pip install -r requirements.txt
      - name: Verify planner, scheduler, evidence, and API
        run: python -m pytest -q tests/test_workflow_engine.py tests/test_nina_workflow.py tests/test_nina_workflow_api.py
