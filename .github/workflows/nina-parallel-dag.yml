name: NINA Parallel DAG Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  dag-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checkout matches trusted source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Source checkout mismatch: $actual != $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked requirements
        run: python -m pip install -r requirements.txt
      - name: Verify planner, scheduler, evidence, and API
        run: python -m pytest -q tests/test_workflow_engine.py tests/test_nina_workflow.py tests/test_nina_workflow_api.py tests/test_igor_workflow.py tests/test_nina_workflow_gate.py tests/test_evidence_concurrency.py tests/test_payment_session_binding.py tests/test_sprint_retro.py tests/test_support_escalator.py

  real-parallel-ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OLA_LLM_PROVIDER: ollama
      OLA_LLM_MODE: required
      OLA_LLM_MODEL: qwen2.5:0.5b-instruct
      OLA_LLM_TIMEOUT: '120'
      OLA_OLLAMA_NUM_PREDICT: '64'
      OLA_RUNTIME_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      OLA_EG_DB_PATH: ola-parallel-ollama.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checkout matches trusted source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Source checkout mismatch: $actual != $EXPECTED_SOURCE_SHA"
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked requirements
        run: python -m pip install -r requirements.txt
      - name: Install and start real Ollama with parallel model capacity
        shell: bash
        run: |
          set -euo pipefail
          # Pin the official Ollama Linux AMD64 release and verify its
          # GitHub-published archive SHA-256 before extracting or executing.
          ollama_version="v0.40.6"
          archive="${RUNNER_TEMP}/ollama-linux-amd64.tar.zst"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/ollama/ollama/releases/download/${ollama_version}/ollama-linux-amd64.tar.zst" \
            --output "$archive"
          echo "c164ab8b1b28e2a247c29719b8e404c423c5b83ae64c3ab4e59d50c7ff7fc5e0  $archive" | sha256sum --check -
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y zstd
          fi
          mkdir -p "$RUNNER_TEMP/ola-ollama"
          zstd -dc "$archive" | tar -xf - -C "$RUNNER_TEMP/ola-ollama"
          export PATH="$RUNNER_TEMP/ola-ollama/bin:$PATH"
          echo "$RUNNER_TEMP/ola-ollama/bin" >> "$GITHUB_PATH"
          OLLAMA_NUM_PARALLEL=2 nohup "$RUNNER_TEMP/ola-ollama/bin/ollama" serve > /tmp/ola-parallel-ollama.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$OLA_LLM_MODEL"
      - name: Prove real Ollama autonomous planning, overlapping parallel workers, and IGOR verification
        run: PYTHONPATH=. python scripts/verify_nina_parallel_ollama.py
      - name: Upload measured execution proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nina-parallel-ollama-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            nina-parallel-ollama-proof.json
            nina-parallel-ollama-evidence.json
            nina-autonomous-ollama-proof.json
            nina-autonomous-ollama-evidence.json
      - name: Print Ollama logs on failure
        if: failure()
        run: tail -100 /tmp/ola-parallel-ollama.log || true
