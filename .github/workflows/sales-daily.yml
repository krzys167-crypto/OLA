name: Sales Daily (report only)

# Lists who in sales/prospects.csv is due for a touch today. It reads the CSV and writes a job summary.
# It sends nothing, uses no secrets and has no write permission: a human sends the messages.
# `schedule` runs only from the default branch, so this starts firing once it is merged there.

on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - "sales/**"
      - "scripts/sales_pipeline.py"
      - ".github/workflows/sales-daily.yml"

permissions:
  contents: read

jobs:
  due-today:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pipeline report and due list
        run: |
          set -euo pipefail
          {
            echo "## Sales pipeline $(date -u +%F)"
            echo '```'
            python3 scripts/sales_pipeline.py report
            echo '```'
            echo "### Due today"
            echo '```'
            python3 scripts/sales_pipeline.py due 2>&1 || true
            echo '```'
            echo "Drafts: \`python3 scripts/sales_pipeline.py draft \"<company>\" --lang fr\`. Nothing is sent from CI."
          } | tee -a "$GITHUB_STEP_SUMMARY"
