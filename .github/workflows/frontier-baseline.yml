name: OLA Frontier Baseline

on:
  push:
    branches: [main]
  # Baseline is intentionally measured from immutable reference 472eaf2, not PR code.
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      OLA_LLM_MODE: deterministic
      OLA_LLM_MODEL: deterministic-runtime-v1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 472eaf20056f73b2d8bf5ed77a63a128b38cc171
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Assert exact baseline source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "472eaf20056f73b2d8bf5ed77a63a128b38cc171"
          echo "BASELINE_SOURCE=VERIFIED"
          echo "BASELINE_SHA=$actual" | tee baseline-source.txt
      - name: Execute baseline benchmark
        run: python -m pytest -q tests/test_frontier_baseline.py -s | tee frontier-baseline.log
      - name: Publish baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ola-frontier-baseline-472eaf20056f73b2d8bf5ed77a63a128b38cc171
          path: |
            frontier-baseline.log
            baseline-source.txt
