name: OLA CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/${{ matrix.language }}"


  security-gate:
    name: CodeQL / security gate
    needs: analyze
    if: ${{ needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Enforce no open critical/high alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            for severity in critical high; do
              response="$(gh api --method GET                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2026-03-10"                 "repos/${REPOSITORY}/code-scanning/alerts"                 -f state=open                 -f severity="${severity}"                 -f ref="refs/pull/${PR_NUMBER}/merge"                 -f per_page=100)"
              count="$(printf '%s' "${response}" | jq 'length')"
              echo "${severity}_open_alerts=${count}"
              if [ "${count}" -gt 0 ]; then
                printf '%s' "${response}" | jq -r '.[] | [
                  .number,
                  .rule.id,
                  .rule.description,
                  (.rule.security_severity_level // "unknown"),
                  .most_recent_instance.location.path,
                  .most_recent_instance.location.start_line
                ] | @tsv'
                echo "CODEQL_GATE=BLOCKED"
                echo "REASON=open_${severity}_alerts"
                exit 1
              fi
            done
          else
            for severity in critical high; do
              response="$(gh api --method GET                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2026-03-10"                 "repos/${REPOSITORY}/code-scanning/alerts"                 -f state=open                 -f severity="${severity}"                 -f ref="${GITHUB_SHA}"                 -f per_page=100)"
              count="$(printf '%s' "${response}" | jq 'length')"
              echo "${severity}_open_alerts=${count}"
              if [ "${count}" -gt 0 ]; then
                printf '%s' "${response}" | jq -r '.[] | [
                  .number,
                  .rule.id,
                  .rule.description,
                  (.rule.security_severity_level // "unknown"),
                  .most_recent_instance.location.path,
                  .most_recent_instance.location.start_line
                ] | @tsv'
                echo "CODEQL_GATE=BLOCKED"
                echo "REASON=open_${severity}_alerts"
                exit 1
              fi
            done
          fi
          echo "CODEQL_GATE=PASS"
