name: OLA CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/${{ matrix.language }}"
          output: codeql-results

      - name: Enforce OLA high/critical policy from SARIF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          import sys

          findings = []
          files = glob.glob("codeql-results/*.sarif")
          for path in files:
              data = json.load(open(path, encoding="utf-8"))
              for run in data.get("runs", []):
                  tool = run.get("tool", {}).get("driver", {}).get("name", "CodeQL")
                  for result in run.get("results", []):
                      props = result.get("properties", {})
                      raw = props.get("security-severity")
                      try:
                          severity = float(raw)
                      except (TypeError, ValueError):
                          severity = 0.0
                      if severity >= 7.0:
                          findings.append({
                              "tool": tool,
                              "rule": result.get("ruleId"),
                              "severity": severity,
                              "message": result.get("message", {}).get("text"),
                          })

          print(json.dumps({
              "codeql_sarif_files": sorted(files),
              "high_or_critical_findings": findings,
              "status": "BLOCK" if findings else "PASS",
          }, sort_keys=True))

          if findings:
              sys.exit(1)
          PY
