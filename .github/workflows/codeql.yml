name: OLA CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/${{ matrix.language }}"

  security-gate:
    name: CodeQL / security gate
    needs: analyze
    if: ${{ needs.analyze.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Check high and critical alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            REF="refs/pull/${PR_NUMBER}/merge"
          else
            REF="${GITHUB_SHA}"
          fi

          for severity in critical high; do
            response="$(gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2026-03-10"               "repos/${REPOSITORY}/code-scanning/alerts"               -f state=open               -f severity="${severity}"               -f ref="${REF}"               -f per_page=100)"

            count="$(printf '%s' "${response}" | jq 'length')"
            echo "${severity}_open_alerts=${count}"
            if [ "${count}" -gt 0 ]; then
              printf '%s' "${response}" | jq -r '.[] | [
                .number,
                .rule.id,
                .rule.description,
                (.rule.security_severity_level // "unknown"),
                .most_recent_instance.location.path,
                .most_recent_instance.location.start_line
              ] | @tsv'
              echo "CODEQL_GATE=BLOCKED"
              echo "REASON=open_${severity}_alerts"
              exit 1
            fi
          done

          echo "CODEQL_GATE=PASS"
