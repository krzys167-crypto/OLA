name: IGOR Independent Evidence Gate

on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      nina_artifact_name:
        required: true
        type: string

permissions: {}

jobs:
  igor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    if: ${{ inputs.source_commit != '' && inputs.nina_artifact_name != '' }}
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      NINA_RUN_ID: ${{ github.run_id }}
      NINA_ARTIFACT_NAME: ${{ inputs.nina_artifact_name }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Assert exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"

      - name: Download NINA evidence artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ env.NINA_ARTIFACT_NAME }}
          path: nina-evidence
          run-id: ${{ env.NINA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub artifact digest and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NINA_ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NINA_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${NINA_ARTIFACT_NAME}\") | .id" | head -n1)"
          test -n "$NINA_ARTIFACT_ID"
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${NINA_ARTIFACT_ID}" --jq '.digest' | sed 's/^sha256://')"
          test -n "$actual"
          printf '%s\n' "$actual" > nina-artifact.sha256
          root="$(find nina-evidence -type f -name runtime-proof.json -print -quit | xargs -r dirname)"
          test -n "$root"
          grep -qx "commit=${SOURCE_COMMIT}" "$root/provenance.txt"
          grep -qx "run=${NINA_RUN_ID}" "$root/provenance.txt"
          (cd "$root" && sha256sum -c runtime-proof.sha256)
          (cd "$root" && sha256sum -c replay-proof.sha256)
          (cd "$root" && sha256sum -c provenance.sha256)

      - name: IGOR independent verifier
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, os
          import subprocess
          root=pathlib.Path(subprocess.check_output(["bash","-lc","find nina-evidence -type f -name runtime-proof.json -print -quit"],text=True).strip()).parent
          d=json.loads((root/"runtime-proof.json").read_text())
          assert d["status"]=="VERIFIED"
          assert d["commit"]==os.environ["SOURCE_COMMIT"]
          assert d["final_result"]=="391"
          assert d["agents"]==["codeact","react","agentic_rag","mcp_tool_use","self_reflection","multi_agent"]
          assert d["evidence_count"]==6
          assert d["hash_chain"]=="PASS"
          assert d["independent_verifier"]=="PASS"
          assert d["human_gate"]=="CONTRACT_ONLY"
          print("IGOR_NINA_BUNDLE=PASS")
          print("IGOR_SOURCE_SHA=PASS")
          print("IGOR_ARTIFACT_HASH=PASS")
          print("IGOR_PROVENANCE=PASS")
          print("IGOR_EVIDENCE_CONTENT=PASS")
          PY

      - name: Tamper mutation must BLOCK
        run: |
          set -euo pipefail
          cp nina-evidence/runtime-proof.json tampered-runtime-proof.json
          python - <<'PY'
          import json
          p="tampered-runtime-proof.json"
          d=json.loads(open(p).read())
          d["final_result"]="392"
          open(p,"w").write(json.dumps(d,sort_keys=True))
          PY
          expected="$(cut -d' ' -f1 nina-evidence/runtime-proof.sha256)"
          actual="$(sha256sum tampered-runtime-proof.json | cut -d' ' -f1)"
          test "$actual" != "$expected"
          echo "TAMPER_CHECK=BLOCK"

      - name: Build exact-source runtime for independent replay
        run: |
          python -m pip install -r requirements.txt
          docker build --tag "ola-igor:${SOURCE_COMMIT}" .

      - name: Start runtime
        run: |
          docker run --detach --rm --name ola-igor-e2e --publish 8001:8000 "ola-igor:${SOURCE_COMMIT}"
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8001/health >/dev/null && exit 0; sleep 1; done
          docker logs ola-igor-e2e
          exit 1

      - name: IGOR real replay
        run: |
          set -euo pipefail
          docker exec -i -e SOURCE_COMMIT="${SOURCE_COMMIT}" ola-igor-e2e python - <<'PY' > igor-replay.json
          import hashlib,json,sqlite3,urllib.request,uuid,os
          db_path="/data/ola.db"
          tenant_id=str(uuid.uuid4())
          raw_key="igor-independent-key"
          db=sqlite3.connect(db_path)
          db.execute("INSERT INTO tenants(id,name) VALUES (?,?)",(tenant_id,"igor-independent-replay"))
          db.execute("INSERT INTO api_keys(id,tenant_id,key_hash) VALUES (?,?,?)",(str(uuid.uuid4()),tenant_id,hashlib.sha256(raw_key.encode()).hexdigest()))
          db.commit(); db.close()
          task="Calculate 17 * 23 and return the verified result."
          req=urllib.request.Request("http://127.0.0.1:8000/agent-run",data=json.dumps({"task":task}).encode(),headers={"Content-Type":"application/json","X-API-Key":raw_key},method="POST")
          with urllib.request.urlopen(req,timeout=15) as response: d=json.load(response)
          assert d["status"]=="VERIFIED"
          assert d["task"]==task
          assert d["final_result"]=="391"
          assert d["agents"]==["codeact","react","agentic_rag","mcp_tool_use","self_reflection","multi_agent"]
          assert d["evidence_count"]==6
          print(json.dumps({"status":"VERIFIED","commit":os.environ["SOURCE_COMMIT"],"result":"391","replay":"PASS","run_id":d["run_id"]},sort_keys=True))
          PY
          cat igor-replay.json

      - name: Build Evidence Bundle v1 and IGOR certificate
        run: |
          set -euo pipefail
          mkdir -p evidence-bundle/source evidence-bundle/runtime evidence-bundle/provenance evidence-bundle/integrity evidence-bundle/verification evidence-bundle/tamper evidence-bundle/replay evidence-bundle/human evidence-bundle/hashes
          printf '%s\n' "${SOURCE_COMMIT}" > evidence-bundle/source/commit.txt
          root="$(find nina-evidence -type f -name runtime-proof.json -print -quit | xargs -r dirname)"
          test -n "$root"
          cp "$root/runtime-proof.json" evidence-bundle/runtime/runtime-proof.json
          cp "$root/replay-proof.json" evidence-bundle/runtime/replay-proof.json
          cp "$root/provenance.txt" evidence-bundle/provenance/provenance.txt
          cp "$root/provenance.sha256" evidence-bundle/provenance/provenance.sha256
          cp "$root/runtime-proof.sha256" evidence-bundle/integrity/runtime-proof.sha256
          cp "$root/replay-proof.sha256" evidence-bundle/integrity/replay-proof.sha256
          cp igor-replay.json evidence-bundle/replay/igor-replay.json
          python - <<'PY'
          import json, os
          d={"status":"VERIFIED","verifier":"IGOR","source_commit":os.environ["SOURCE_COMMIT"],"nina_run_id":int(os.environ["NINA_RUN_ID"]),"nina_artifact_name":os.environ["NINA_ARTIFACT_NAME"],"nina_artifact_sha256":open("nina-artifact.sha256").read().strip(),"tamper":"BLOCK","replay":"PASS","human_gate":"PENDING"}
          open("evidence-bundle/verification/igor-result.json","w").write(json.dumps(d,sort_keys=True)+"\n")
          PY
          printf '%s\n' '{"status":"BLOCKED_PENDING_HUMAN_APPROVAL","human_gate":"PENDING","reason":"Automated IGOR verification is complete; final Human Gate is not asserted by automation."}' > evidence-bundle/human/human-gate.json
          cp nina-artifact.sha256 evidence-bundle/integrity/nina-artifact.sha256
          find evidence-bundle -type f ! -path '*/hashes/*' -print0 | sort -z | xargs -0 sha256sum > evidence-bundle/hashes/files.sha256
          sha256sum evidence-bundle/verification/igor-result.json > evidence-bundle/hashes/igor-result.sha256
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path("evidence-bundle")
          manifest={
            "schema":"evidence-bundle/v1",
            "source_commit":os.environ["SOURCE_COMMIT"],
            "nina_run_id":int(os.environ["NINA_RUN_ID"]),
            "nina_artifact_name":os.environ["NINA_ARTIFACT_NAME"],
            "nina_artifact_sha256":(root/"integrity"/"nina-artifact.sha256").read_text().strip(),
            "igor":"VERIFIED",
            "tamper":"BLOCK",
            "replay":"PASS",
            "human_gate":"PENDING"
          }
          (root/"MANIFEST.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          digest=hashlib.sha256((root/"MANIFEST.json").read_bytes()).hexdigest()
          (root/"hashes"/"bundle-manifest.sha256").write_text(f"{digest}  MANIFEST.json\n")
          PY
          test "$(cut -d' ' -f1 evidence-bundle/hashes/bundle-manifest.sha256)" = "$(sha256sum evidence-bundle/MANIFEST.json | cut -d' ' -f1)"

      - name: Own IGOR SHA-256
        run: |
          sha256sum evidence-bundle/verification/igor-result.json
          sha256sum igor-replay.json
          tar -czf igor-evidence-bundle.tar.gz evidence-bundle
          sha256sum igor-evidence-bundle.tar.gz | tee igor-evidence-bundle.sha256

      - name: Generate IGOR evidence attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: igor-evidence-bundle.tar.gz

      - name: Independently verify IGOR attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify igor-evidence-bundle.tar.gz -R "$GITHUB_REPOSITORY"

      - name: Human Gate hold
        run: |
          test "$(jq -r .human_gate evidence-bundle/verification/igor-result.json)" = "PENDING"
          echo "HUMAN_GATE=PENDING"

      - name: Upload IGOR evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: igor-independent-evidence-${{ env.SOURCE_COMMIT }}
          path: |
            igor-evidence-bundle.tar.gz
            igor-evidence-bundle.sha256
            evidence-bundle/
