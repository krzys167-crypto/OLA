name: Nina Real Runtime Provenance Gate (OpenAI optional)

on:
  push:
    branches: [main, full-runtime-replay-proof]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    outputs:
      evidence_created: ${{ steps.detect-credential.outputs.available }}
    environment:
      name: ci-openai
      deployment: false
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      OPENAI_AVAILABLE: ${{ secrets.OPENAI_API_KEY != '' }}
      EXPECTED_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      OLA_LLM_MODE: required
      OLA_LLM_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact SHA
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
      - name: Detect real LLM credential
        id: detect-credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "REAL_OPENAI_CREDENTIAL=AVAILABLE"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "REAL_OPENAI_CREDENTIAL=SKIPPED — Ollama is the AUTO provider"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        run: python -m pip install -r requirements.txt
      - name: Build deployment image from exact source
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        run: docker build --tag "ola:${EXPECTED_COMMIT}" .
      - name: Run real runtime
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker run --detach --rm --name ola-nina-e2e --publish 8000:8000 \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e OLA_LLM_MODE="$OLA_LLM_MODE" \
            -e OLA_LLM_MODEL="$OLA_LLM_MODEL" \
            "ola:${EXPECTED_COMMIT}"
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8000/health >/dev/null && exit 0; sleep 1; done
          docker logs ola-nina-e2e; exit 1
      - name: Real /agent-run with exact provenance
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          docker exec -i -e EXPECTED_COMMIT="${EXPECTED_COMMIT}" -e OPENAI_API_KEY="${OPENAI_API_KEY}" -e OLA_SOURCE_COMMIT="${EXPECTED_COMMIT}" -e OLA_RUNTIME_COMMIT="${EXPECTED_COMMIT}" -e OLA_LLM_MODE="${OLA_LLM_MODE}" -e OLA_LLM_MODEL="${OLA_LLM_MODEL}" ola-nina-e2e python - <<'PY' > runtime-proof.json
          import hashlib,json,os,sqlite3,subprocess,urllib.request,uuid
          db_path="/data/ola.db"; tenant_id=str(uuid.uuid4()); raw_key="ci-real-runtime-key"
          db=sqlite3.connect(db_path)
          db.execute("INSERT INTO tenants(id,name) VALUES (?,?)",(tenant_id,"ci-exact-runtime"))
          db.execute("INSERT INTO api_keys(id,tenant_id,key_hash) VALUES (?,?,?)",(str(uuid.uuid4()),tenant_id,hashlib.sha256(raw_key.encode()).hexdigest()))
          db.commit(); db.close()
          task="Calculate 17 * 23 and return the verified result."
          def call():
            req=urllib.request.Request("http://127.0.0.1:8000/agent-run",data=json.dumps({"task":task}).encode(),headers={"Content-Type":"application/json","X-API-Key":raw_key},method="POST")
            with urllib.request.urlopen(req,timeout=15) as response: return json.load(response)
          result=call()
          assert result["status"]=="VERIFIED" and result["task"]==task and result["final_result"]=="391",result
          assert result["agents"]==["codeact","react","agentic_rag","mcp_tool_use","self_reflection","multi_agent"],result
          assert result["evidence_count"]==6,result
          assert all(item["invocation_type"]=="real_llm" for item in result["execution"]),result
          assert all(item["provider"]=="openai" for item in result["execution"]),result
          assert all(item["model"]==os.environ["OLA_LLM_MODEL"] for item in result["execution"]),result
          assert all(item.get("response_id") or item.get("response_digest") for item in result["execution"]),result
          db=sqlite3.connect(db_path); rows=db.execute("SELECT id,tenant_id,seq,record_type,payload_json,prev_hash,record_hash FROM evidence_records WHERE tenant_id=? ORDER BY seq",(tenant_id,)).fetchall(); db.close()
          assert [r[0] for r in rows]==result["evidence_ids"]
          expected_prev="0"*64
          for expected_seq,row in enumerate(rows):
            _,row_tenant,seq,rtype,payload_json,prev_hash,record_hash=row
            assert row_tenant==tenant_id and seq==expected_seq and prev_hash==expected_prev
            assert record_hash==hashlib.sha256(f"ola.chain/2|{tenant_id}|{seq}|{prev_hash}|{len(rtype)}:{rtype}|{payload_json}".encode()).hexdigest()
            expected_prev=record_hash
          verifier=subprocess.run(["python","scripts/verify_agent_runtime.py","--tenant-id",tenant_id,"--run-id",result["run_id"],"--expected-commit",os.environ["EXPECTED_COMMIT"],"--expected-task",task,"--expected-result","391","--expected-provider","openai","--expected-model",os.environ["OLA_LLM_MODEL"],"--expected-invocation-type","real_llm"],capture_output=True,text=True)
          assert verifier.returncode==0,(verifier.stdout,verifier.stderr)
          print(json.dumps({"status":"VERIFIED","commit":os.environ["EXPECTED_COMMIT"],"source_commit":os.environ["EXPECTED_COMMIT"],"task":task,"final_result":"391","agents":result["agents"],"evidence_ids":result["evidence_ids"],"evidence_count":len(rows),"hash_chain":"PASS","independent_verifier":"PASS","human_gate":"CONTRACT_ONLY","provider":"openai","model":os.environ["OLA_LLM_MODEL"],"invocation_type":"real_llm","llm_invocations":len(result["execution"]),"response_ids":[item["response_id"] for item in result["execution"] if item.get("response_id")],
          "response_digests":[item["response_digest"] for item in result["execution"] if item.get("response_digest")],"run_id":result["run_id"]},sort_keys=True))
          PY
          cat runtime-proof.json
      - name: Independent artifact verifier
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        env:
          EXPECTED_COMMIT: ${{ env.EXPECTED_COMMIT }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          d=json.load(open("runtime-proof.json")); expected=os.environ["EXPECTED_COMMIT"]
          assert d["status"]=="VERIFIED" and d["commit"]==expected and d["source_commit"]==expected and d["hash_chain"]=="PASS" and d["independent_verifier"]=="PASS" and d["human_gate"]=="CONTRACT_ONLY"
          assert d["provider"]=="openai" and d["model"]=="gpt-5.6-luna" and d["invocation_type"]=="real_llm"
          assert d["llm_invocations"]==6 and len(d["response_ids"]) + len(d.get("response_digests", []))==6 and (d["response_ids"] or d.get("response_digests"))
          print("INDEPENDENT_ARTIFACT=VERIFIED")
          print("REAL_OPENAI_LLM=VERIFIED")
          print("SHA256="+hashlib.sha256(open("runtime-proof.json","rb").read()).hexdigest())
          PY
      - name: Tamper mutation must block
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        run: |
          set -euo pipefail
          cp runtime-proof.json runtime-proof.tampered.json
          sha256sum runtime-proof.tampered.json > runtime-proof.tampered.sha256
          python - <<'PY'
          import json
          p="runtime-proof.tampered.json"
          d=json.load(open(p))
          d["final_result"]="392"
          json.dump(d,open(p,"w"),sort_keys=True)
          PY
          if sha256sum -c runtime-proof.tampered.sha256; then
            echo "FAIL: tampered runtime proof passed SHA-256 integrity check"
            exit 1
          fi
          echo "TAMPER_MUTATION=BLOCK"
      - name: Full runtime replay
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          docker exec -i -e EXPECTED_COMMIT="${EXPECTED_COMMIT}" -e OPENAI_API_KEY="${OPENAI_API_KEY}" -e OLA_LLM_MODE="${OLA_LLM_MODE}" -e OLA_LLM_MODEL="${OLA_LLM_MODEL}" ola-nina-e2e python - <<'PY' > replay-proof.json
          import json,os,urllib.request
          task="Calculate 17 * 23 and return the verified result."
          req=urllib.request.Request("http://127.0.0.1:8000/agent-run",data=json.dumps({"task":task}).encode(),headers={"Content-Type":"application/json","X-API-Key":"ci-real-runtime-key"},method="POST")
          with urllib.request.urlopen(req,timeout=15) as response: d=json.load(response)
          assert d["status"]=="VERIFIED" and d["task"]==task and d["final_result"]=="391"
          assert d["agents"]==["codeact","react","agentic_rag","mcp_tool_use","self_reflection","multi_agent"]
          assert d["evidence_count"]==6
          assert all(item["invocation_type"]=="real_llm" for item in d["execution"])
          assert all(item["provider"]=="openai" for item in d["execution"])
          assert all(item["model"]==os.environ["OLA_LLM_MODEL"] for item in d["execution"])
          assert all(item.get("response_id") or item.get("response_digest") for item in d["execution"])
          assert d.get("commit",os.environ["EXPECTED_COMMIT"])==os.environ["EXPECTED_COMMIT"] and d.get("source_commit",os.environ["EXPECTED_COMMIT"])==os.environ["EXPECTED_COMMIT"]
          print(json.dumps({"status":"VERIFIED","commit":os.environ["EXPECTED_COMMIT"],"result":"391","replay":"PASS","provider":"openai","model":os.environ["OLA_LLM_MODEL"],"invocation_type":"real_llm","llm_invocations":len(d["execution"]),"run_id":d["run_id"]},sort_keys=True))
          PY
          cat replay-proof.json
      - name: Human Gate
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime-proof.json")); assert d["human_gate"]=="CONTRACT_ONLY"; print("HUMAN_GATE=CONTRACT_ONLY")
          PY
      - name: Write provenance and hashes
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        run: |
          printf 'commit=%s\nrun=%s\nartifact=runtime-proof.json\nreplay=replay-proof.json\n' "${EXPECTED_COMMIT}" "${GITHUB_RUN_ID}" > provenance.txt
          sha256sum runtime-proof.json > runtime-proof.sha256
          sha256sum provenance.txt > provenance.sha256
          sha256sum replay-proof.json > replay-proof.sha256
      - name: Upload immutable runtime evidence
        if: ${{ env.OPENAI_AVAILABLE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nina-real-runtime-proof-${{ github.sha }}
          path: |
            runtime-proof.json
            runtime-proof.sha256
            replay-proof.json
            replay-proof.sha256
            provenance.txt
            provenance.sha256

  igor-independent:
    if: ${{ github.event_name != 'pull_request' && needs.runtime-proof.outputs.evidence_created == 'true' }}
    needs: runtime-proof
    uses: ./.github/workflows/igor-independent-evidence.yml
    with:
      source_commit: ${{ github.sha }}
      nina_artifact_name: nina-real-runtime-proof-${{ github.sha }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
