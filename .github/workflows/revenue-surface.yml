name: Revenue Surface Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


jobs:
  revenue-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify revenue surface
        run: |
          set -euo pipefail
          test -f revenue/index.html
          grep -q "OLA Execution Audit" revenue/index.html
          if grep -Fq 'https://buy.stripe.com/' revenue/index.html; then
            echo "::error::Unverified Stripe Payment Link must not be published as a working CTA."
            exit 1
          fi
          grep -q "CI-VERIFIED" revenue/index.html
          grep -q "CHECKOUT NOT AVAILABLE" revenue/index.html
          grep -Fq 'aria-disabled="true"' revenue/index.html
          grep -qi "Checkout remains disabled" revenue/index.html
          grep -qi 'public customer-onboarding path' docs/revenue-marketing-flow.md
          echo "REVENUE_SURFACE=HONEST_DISABLED"
          echo "STRIPE_MODE=NOT_CONFIGURED"
          echo "PRODUCTION_REVENUE=NOT_PROVEN"
