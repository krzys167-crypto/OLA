[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ola-evidence-graph"
version = "0.1.0"
description = "SQLite-backed Evidence Graph projection for OLA"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
